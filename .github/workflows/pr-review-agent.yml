name: pr-review-agent

# On PR open/sync, ask an AI model to review the diff and post a COMMENT review.
# Requires repo secret AI_API_KEY (xAI key from console.x.ai; any OpenAI-compatible provider works via AI_API_BASE). Optional: AI_API_BASE, AI_MODEL.

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Skip bot-only noise if desired; still review human/agent PRs
    # Off until an AI key exists: set repo variable AI_ENABLED=true (Settings > Secrets and variables > Actions > Variables) to turn on.
    if: ${{ vars.AI_ENABLED == 'true' && github.actor != 'github-actions[bot]' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Review PR and post comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_BASE: ${{ secrets.AI_API_BASE }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
        run: python bot/pr_review_agent.py
