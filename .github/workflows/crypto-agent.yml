name: crypto-paper-agent

on:
  schedule:
    # Every 4 hours - adjust as needed. GitHub Actions scheduled runs have some delay.
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      symbols:
        description: 'Comma-separated CoinGecko ids (e.g. bitcoin,ethereum,ripple,bitcoin-cash,kaspa)'
        required: false
        default: 'bitcoin,ethereum,ripple,bitcoin-cash,kaspa'

permissions:
  contents: write  # to commit paper_state.json back to repo

jobs:
  paper-trade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run paper trader
        env:
          SYMBOLS: ${{ github.event.inputs.symbols || 'bitcoin,ethereum,ripple,bitcoin-cash,kaspa' }}
          STARTING_BALANCE: '50'
          MAX_RISK_PER_TRADE_PCT: '2'
          STATE_FILE: 'bot/paper_state.json'
        run: |
          python bot/paper_trader.py

      - name: Commit state
        run: |
          git config user.name "crypto-paper-agent"
          git config user.email "crypto-paper-agent@users.noreply.github.com"
          git add bot/paper_state.json || true
          if git diff --staged --quiet; then
            echo "No state changes to commit"
            exit 0
          fi
          git commit -m "paper trade log $(date -u +%Y-%m-%dT%H:%MZ)"
          # main moves often (auto-changelog, dashboard, digests): on a
          # rejected push, rebase onto origin/main and retry.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Pushed paper state on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt rejected"
            [ "$attempt" -eq 3 ] && break
            echo "Rebasing onto origin/main and retrying"
            sleep $((attempt * 5))
            if ! { git fetch origin main && git rebase origin/main; }; then
              git rebase --abort 2>/dev/null || true
              echo "Rebase onto origin/main failed"
              break
            fi
          done
          echo "::warning title=paper state not pushed::Could not push bot/paper_state.json after retries; this run's state is only in the uploaded artifact."

      - name: Upload log artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper-log-${{ github.run_id }}
          path: bot/paper_state.json
