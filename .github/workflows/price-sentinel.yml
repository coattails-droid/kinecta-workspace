name: price-sentinel

# Watches tracked coins for large 24h moves. Opens a GitHub issue when a coin
# moves beyond ALERT_THRESHOLD_PCT, comments fresh readings on the open alert,
# and closes the issue automatically once the move settles.

on:
  schedule:
    # Every hour
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      threshold_pct:
        description: 'Alert threshold in percent (24h move)'
        required: false
        default: '5'
      dry_run:
        description: 'Print actions without opening/closing issues (1/0)'
        required: false
        default: '0'

permissions:
  contents: read   # needed for checkout now that the repo is private
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Rolling Uphold price snapshots (bot/prices.py) so KAS still gets a
      # 24h change from Uphold if Kraken is down. Each run saves a new cache
      # entry; restore-keys picks up the most recent one.
      - name: Restore price snapshots
        uses: actions/cache/restore@v4
        with:
          path: .price-cache
          key: price-snapshots-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: price-snapshots-

      - name: Check prices and manage alerts
        env:
          PRICE_SNAPSHOT_FILE: .price-cache/snapshots.json
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COIN_IDS: 'bitcoin,ethereum,ripple,bitcoin-cash,kaspa'
          ALERT_THRESHOLD_PCT: ${{ github.event.inputs.threshold_pct || '5' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: python bot/price_sentinel.py

      - name: Save price snapshots
        if: always() && hashFiles('.price-cache/snapshots.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .price-cache
          key: price-snapshots-${{ github.run_id }}-${{ github.run_attempt }}
