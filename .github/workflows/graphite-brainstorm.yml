name: graphite-brainstorm

# Manual creative brainstorms for Seeded Geometries (graphite / art / design ideas).
# Requires repo secret AI_API_KEY (xAI key from console.x.ai; any OpenAI-compatible provider works via AI_API_BASE). Optional: AI_API_BASE, AI_MODEL.

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic / prompt for the brainstorm (optional)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  brainstorm:
    runs-on: ubuntu-latest
    # Off until an AI key exists: set repo variable AI_ENABLED=true to turn on.
    if: ${{ vars.AI_ENABLED == 'true' }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate brainstorm
        id: gen
        env:
          TOPIC: ${{ github.event.inputs.topic }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_BASE: ${{ secrets.AI_API_BASE }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
        run: |
          set -euo pipefail
          python bot/graphite_brainstorm.py | tee /tmp/brainstorm-out.txt
          PATH_LINE="$(grep '^BRAINSTORM_PATH=' /tmp/brainstorm-out.txt | tail -n1 || true)"
          echo "path=${PATH_LINE#BRAINSTORM_PATH=}" >> "$GITHUB_OUTPUT"

      - name: Commit brainstorm file
        env:
          TOPIC: ${{ github.event.inputs.topic }}
        run: |
          set -euo pipefail
          git config user.name "graphite-brainstorm"
          git config user.email "graphite-brainstorm@users.noreply.github.com"
          git add brainstorms/
          TOPIC_LABEL="${TOPIC:-seeded-geometries ideas}"
          # sanitize for commit subject
          TOPIC_LABEL="$(printf '%s' "$TOPIC_LABEL" | tr '\n\r' ' ' | cut -c1-72)"
          if git diff --staged --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "brainstorm: ${TOPIC_LABEL}"
          for i in 1 2 3 4 5; do
            if git push; then break; fi
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            sleep 3
          done
